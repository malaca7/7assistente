name: Deploy Production (Discloud & GitHub Pages)

on:
  push:
    branches:
      - main
      - source
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-discloud:
    name: Deploy to Discloud
    runs-on: ubuntu-latest
    continue-on-error: true
    if: "${{ secrets.DISCLOUD_TOKEN != '' }}"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Discloud
        uses: discloud/deploy-action@v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: "talvanebarber"

  build-and-deploy-pages:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build React Admin Panel
        run: npm run build

      - name: Setup CNAME and SPA Routing
        run: |
          echo "talvane.malaca.com.br" > dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
