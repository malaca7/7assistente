name: Deploy Production (GitHub Pages & Discloud)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy-pages:
    name: Build React Admin Panel & Deploy GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Setup CNAME and SPA Routing
        run: |
          echo "talvane.malaca.com.br" > dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: Deploy to GitHub Pages Environment
    needs: build-and-deploy-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-discloud:
    name: Deploy to Discloud & Restart Bot
    needs: build-and-deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
          echo "talvane.malaca.com.br" > dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Package Discloud Application (ZIP)
        run: |
          zip -r 7assistente.zip index.mjs index.js package.json discloud.config .discloudignore server dist

      - name: Deploy via Discloud API & Restart Bot
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN || 'eyJhbGciOiJIUzI1NiJ9.eyJpZCI6IjI4ODUxOTI1OTYyMDgiLCJrZXkiOiIzMTE1ZTQwYTY3ODY0MDg3NmRlYzZhOTk4YTYwIn0.y3RYPKpF9VdbnO-Qhry-84k-1bP3bhpWeQ7AfjqLXqk' }}
        run: |
          echo "🚀 Enviando commit de atualização para Discloud App talvanebarber..."
            RESPONSE=$(curl -s -X PUT "https://api.discloud.app/v2/app/talvanebarber/commit" \
              -H "api-token: $DISCLOUD_TOKEN" \
              -F "file=@7assistente.zip")
            echo "Resposta Discloud Commit: $RESPONSE"
            
            echo "⏳ Aguardando 10 segundos para processamento e descompactação dos arquivos na Discloud..."
            sleep 10
            
            echo "🔄 Reiniciando aplicação do bot na Discloud..."
            RESTART_RESP=$(curl -s -X PUT "https://api.discloud.app/v2/app/talvanebarber/restart" \
              -H "api-token: $DISCLOUD_TOKEN")
            echo "Resposta Discloud Restart: $RESTART_RESP"
            
            echo "✅ Deploy e reinicialização automática do bot concluídos com sucesso na Discloud!"
          fi
