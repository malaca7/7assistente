name: Deploy Production (GitHub Pages & Discloud)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy-pages:
    name: Build React Admin Panel & Deploy GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Setup CNAME and SPA Routing
        run: |
          echo "talvane.malaca.com.br" > dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: Deploy to GitHub Pages Environment
    needs: build-and-deploy-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-discloud:
    name: Deploy to Discloud & Restart Bot
    needs: build-and-deploy-pages
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
          echo "talvane.malaca.com.br" > dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Package Discloud Application (ZIP)
        run: |
          zip -r 7assistente.zip index.mjs index.js package.json discloud.config .discloudignore server dist

      - name: Deploy via Discloud API & Restart Bot
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          node deployDiscloud.mjs "$DISCLOUD_TOKEN"
